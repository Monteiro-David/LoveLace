services:
  database:
    image: postgres:16
    container_name: Lovelace_db
    environment:
      POSTGRES_USER: ada
      POSTGRES_PASSWORD: ada
      POSTGRES_DB: Lovelace
    ports:
      - "5432:5432"
    volumes:
      - ./Lovelace.sql:/docker-entrypoint-initdb.d/01-Lovelace.sql
      - LoveLace-data:/var/lib/postgresql/data

  backend:
    build:
      context: ./Back-end
      dockerfile: Dockerfile
    container_name: Lovelace_backend
    env_file:
      - ./Back-end/.env
    ports:
      - "3000:3000"
    depends_on:
      - database

  frontend:
    build:
      context: ./Front-end
      dockerfile: Dockerfile
    container_name: Lovelace_frontend
    environment:
      - VITE_API_TARGET=http://backend:3000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  LoveLace-data: