name: securite
on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *" #0: minutes; 12: l'heure de demarage; *jour du mois, mois de l'annee et la derniere jour de la semaine
jobs:
  node-audit:
    name: "audit node"
    runs-on: ubuntu-26.04
    steps:
      - name: Check du dépôt 
        uses: actions/checkout@v7
        
      - name: Configurer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            Back-end/package-lock.json
            Front-end/package-lock.json

      - name: Audit dependances Back-end
        working-directory: Back-end
        run: npm audit --audit-level=high

      - name: Audit dépendancs Front-end
        working-directory: Front-end
        run: npm audit --audit-level=high
